name: Test notebook and scripts

on: [push, pull_request, workflow_dispatch]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install nbconvert ipykernel
      - name: Run the notebook top to bottom
        run: jupyter nbconvert --to notebook --execute Choice_Based_Conjoint_Analysis_Workbook.ipynb --output /tmp/executed.ipynb
      - name: Run the standalone scripts
        run: |
          python code/fractional_factorial_design.py --specs Feature_specs.csv --template Feature_template.csv --output /tmp/design.csv --save-level-summary /tmp/levels.csv
          python code/run_conjoint_analysis.py --responses Survey_response.csv --levels /tmp/levels.csv --design /tmp/design.csv --output-dir /tmp/out
